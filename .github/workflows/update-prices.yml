name: Update Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. GET PRICES FROM FRAGMENT
      # ==========================================

      - name: Get prices from Fragment API
        env:
          API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          mkdir -p api

          curl -fsS \
            -H "X-API-Key: $API_KEY" \
            "https://api.fragment-api.io/api/prices/list" \
            -o api/prices.json

          echo "===== RAW FRAGMENT DATA ====="
          cat api/prices.json
          echo "===== END RAW FRAGMENT DATA ====="


      # ==========================================
      # 3. GET TON PRICE FROM BITPIN
      # ==========================================

      - name: Get TON price from Bitpin
        run: |
          RESPONSE=$(curl -L -s "https://api.bitpin.ir/v1/mkt/markets/")

          TON_PRICE=$(echo "$RESPONSE" | node -e "
          let data = '';

          process.stdin.on('data', c => data += c);

          process.stdin.on('end', () => {
            const json = JSON.parse(data);

            const market = json.results.find(
              x => x.code === 'GRAM_IRT'
            );

            if (!market) {
              console.error('GRAM_IRT market not found');
              process.exit(1);
            }

            console.log(market.price);
          });
          ")

          echo "TON_PRICE=$TON_PRICE" >> "$GITHUB_ENV"

          echo "TON PRICE:"
          echo "$TON_PRICE"


      # ==========================================
      # 4. CONVERT PRICES
      # ==========================================

      - name: Convert prices to Toman
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          node scripts/convert-prices.js


      # ==========================================
      # 5. SHOW FINAL PRICES
      # ==========================================

      - name: Show final prices
        run: |
          echo "===== FINAL PRICES.JSON ====="
          cat api/prices.json
          echo "===== END FINAL PRICES.JSON ====="


      # ==========================================
      # 6. COMMIT UPDATED PRICES
      # ==========================================

      - name: Commit updated prices
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add api/prices.json

          git diff --cached --quiet || (
            git commit -m "Update prices"
            git push
          )
