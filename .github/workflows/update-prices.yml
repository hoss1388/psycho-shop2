name: Update Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get prices from Fragment API
        env:
          API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          mkdir -p api

          curl -H "X-API-Key: $API_KEY" \
          https://api.fragment-api.io/api/prices/list \
          -o api/prices.json

      # ===== DEBUG PREMIUM PRICES =====
      - name: Debug Fragment Premium Prices
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("api/prices.json", "utf8")
          );

          console.log("===== FRAGMENT PREMIUM DATA =====");

          data
            .filter(x => x.product_type === "premium")
            .forEach(x => {
              console.log(
                JSON.stringify({
                  product_type: x.product_type,
                  item_name: x.item_name,
                  price: x.price,
                  currency: x.currency
                })
              );
            });

          console.log("===== END PREMIUM DATA =====");
          NODE

      - name: Get TON price from Bitpin
        run: |
          RESPONSE=$(curl -L -s "https://api.bitpin.ir/v1/mkt/markets/")

          TON_PRICE=$(echo "$RESPONSE" | node -e "
          let data='';
          process.stdin.on('data',c=>data+=c);
          process.stdin.on('end',()=>{
            let json=JSON.parse(data);

            let market=json.results.find(
              x => x.code === 'GRAM_IRT'
            );

            console.log(market.price);
          });
          ")

          echo "TON_PRICE=$TON_PRICE" >> $GITHUB_ENV

      - name: Convert prices to Toman
        run: |
          node scripts/convert-prices.js

      - name: Commit updated prices
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add api/prices.json

          git diff --cached --quiet || (
            git commit -m "Update prices"
            git push
          )
